name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install.sh install-codespaces.sh install-local.sh lib.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats
        run: bats tests/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh inside Codespaces base image
        run: |
          docker run --rm \
            -e CODESPACES=true \
            -v "$PWD:/dotfiles" \
            mcr.microsoft.com/devcontainers/universal:latest \
            bash -c '
              set -e
              cp -r /dotfiles /home/codespace/dotfiles
              chown -R codespace:codespace /home/codespace/dotfiles
              su - codespace -c "/home/codespace/dotfiles/install.sh"
              shell="$(getent passwd codespace | cut -d: -f7)"
              echo "Login shell after install: $shell"
              [[ "$shell" == *zsh ]]
              [[ -L /home/codespace/.zshrc ]]
              [[ -L /home/codespace/.config/git/config ]]
            '
