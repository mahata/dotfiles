name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck install.sh install-codespaces.sh install-local.sh lib.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats
        run: |
          if ls tests/*.bats >/dev/null 2>&1; then
            bats tests/
          else
            echo "No .bats tests found, skipping."
          fi

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh inside Codespaces base image
        run: |
          docker run --rm \
            -e CODESPACES=true \
            -v "$PWD:/dotfiles" \
            mcr.microsoft.com/devcontainers/universal:latest \
            bash -c '
              set -e
              cp -r /dotfiles /home/codespace/dotfiles
              chown -R codespace:codespace /home/codespace/dotfiles
              before_shell="$(getent passwd codespace | cut -d: -f7)"
              su - codespace -c "CODESPACES=true /home/codespace/dotfiles/install.sh"
              after_shell="$(getent passwd codespace | cut -d: -f7)"
              echo "Login shell before: $before_shell, after: $after_shell"
              [[ "$before_shell" == "$after_shell" ]]
              [[ -L /home/codespace/.config/git/config ]]
            '
